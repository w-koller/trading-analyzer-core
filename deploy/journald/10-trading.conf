# Journald caps for this LXC.
#
# All app logging goes to journald (main.py logs to stderr; the units set no
# StandardOutput, so systemd captures it). Deliberately the only sink — a
# second one would mean two retention policies and two places to grep.
#
# Without a cap journald defaults to 10% of the filesystem, which on a 16 GB
# rootfs is 1.6 GB of logs competing with the database and the Next build.
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=25M
MaxRetentionSec=1month
