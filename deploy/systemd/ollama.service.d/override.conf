# Bind Ollama to every interface so the trading LXC can reach it.
#
# THIS IS A DROP-IN ON PURPOSE, AND THAT IS THE WHOLE POINT OF THE FILE.
# Ollama's official install script (`curl -fsSL https://ollama.com/install.sh | sh`)
# REWRITES /etc/systemd/system/ollama.service on every update. An
# Environment= line added directly to that unit is silently wiped by the
# next upgrade, Ollama reverts to its 127.0.0.1:11434 default, and the
# dashboard starts reporting "Degraded - Ollama unreachable" while the LXC
# itself is perfectly healthy. This has already happened once (2026-08-29).
# The installer does not touch ollama.service.d/, so the setting survives here.
#
# Diagnosing the reverted state takes one command from the trading LXC:
# a connection REFUSED in microseconds (curl exit 7) rather than a timeout
# means the packet arrived and nothing was listening — a network or firewall
# fault times out instead. `ss -tlnp | grep 11434` on this box then shows
# 127.0.0.1 rather than *:11434.
#
# NOT installed by anything in this repo. This file belongs on the OLLAMA
# LXC (192.168.68.49), which this repo does not provision — see
# deploy/README-ollama.md. It is kept here for the same reason
# moomoo-opend.service is: so the deployed state is reproducible from git
# rather than remembered.
#
# Binding 0.0.0.0 exposes an UNAUTHENTICATED model API. Never install this
# without deploy/nftables/ollama.nft alongside it — Ollama has no auth of
# its own, so the firewall is the only thing restricting who may use, pull
# or DELETE models.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
